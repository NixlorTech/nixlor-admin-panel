services:
  postgres:
    image: postgres:16-alpine
    container_name: nixlor-test-pg
    environment:
      POSTGRES_USER: nixlor_test
      POSTGRES_PASSWORD: nixlor_test
      POSTGRES_DB: nixlor_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nixlor_test -d nixlor_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s
